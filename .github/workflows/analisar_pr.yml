name: Analyze Pull Request with AI

on:
  push:
    branches:
      - main
      - Dev
  pull_request:
    branches:
      - main
      - Dev
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - Dev

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-pr:
    name: Analisar PR com IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do PR
        uses: actions/checkout@v3
        with:
          fetch-depth: 2  # Para garantir que temos o diff completo

      - name: Obter Diff do PR
        id: pr_diff
        run: |
          # Pega o diff entre o código base e o PR
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} > pr.diff
          
          # Exibe o diff para depuração
          cat pr.diff

      - name: Preparar o Prompt para IA
        id: prepare_prompt
        run: |
          # Lê o diff do PR
          diff_content=$(cat pr.diff)

          # Cria o prompt para análise do PR
          prompt="Analisando o seguinte Pull Request:

          Aqui estão as modificações feitas no PR:
          \`\`\`diff
          $diff_content
          \`\`\`

          Por favor, identifique qualquer vulnerabilidade de segurança ou melhoria de código necessária. Se possível, sugira uma correção."

          # Escape o prompt para lidar com caracteres especiais
          escaped_prompt=$(jq -Rs <<< "$prompt")
          
          # Salva o prompt no ambiente do GitHub Actions
          echo "escaped_prompt=$escaped_prompt" >> $GITHUB_ENV

      - name: Enviar Prompt para IA e Obter Resposta
        id: ai_response
        run: |
          # Recupera o prompt escapado do ambiente
          escaped_prompt=$ESCAPED_PROMPT
          
          # Envia o prompt para a IA (TinyLlama ou outro modelo) e captura a resposta
          response=$(curl -s -X POST http://localhost:11399/api/generate \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"tinyllama\", \"stream\": false, \"prompt\": \"$escaped_prompt\"}")

          # Extraímos o resultado da IA ou erro
          result=$(echo "$response" | jq -r '.response // .error')

          # Definindo o resultado para a próxima etapa
          echo "result=$result" >> $GITHUB_ENV

      - name: Comentar no PR com a Resposta da IA
        if: env.result != 'null' && env.result != 'erro'
        run: |
          # Comenta no PR com o resultado da IA
          comment_body="### 🤖 Análise Automática da IA

          **Resultado da Análise:**

          ${{ env.result }}

          Por favor, revise as sugestões e implemente as correções necessárias.

          [🔗 Ver PR no GitHub](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${{ github.event.pull_request.number }})"

          # Escapar o comentário para evitar problemas de JSON malformado
          escaped_body=$(printf '%s' "$comment_body" | jq -Rs .)

          # Envia o comentário para o GitHub
          curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "{\"body\": $escaped_body}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments"

      - name: Parar Ambiente IA (se necessário)
        run: |
          # Parar o container da IA (TinyLlama)
          docker stop ollama && docker rm ollama || true
